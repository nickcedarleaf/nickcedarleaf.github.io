<!DOCTYPE html>
<html>
<head>
  <title>Our Retail Partners</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
    }

    .slide {
      display: none;
      position: relative;
    }

    img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
    }

    .text {
      position: absolute;
      bottom: 40px;
      left: 40px;
      color: white;
      font-size: 28px;
      background: rgba(0,0,0,0.4);
      padding: 10px 20px;
      border-radius: 6px;
    }

    .active {
      display: block;
    }

    .nav {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 40px;
      cursor: pointer;
    }

    .nav div {
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="slide active">
  <img src="store1.jpg">
  <div class="text">Coastal Cottage – Frisco, NC</div>
</div>

<div class="slide">
  <img src="store2.jpg">
  <div class="text">Village Store – Stowe, VT</div>
</div>

<div class="slide">
  <img src="store3.jpg">
  <div class="text">Garden Gate – Charlottesville, VA</div>
</div>

<div class="nav">
  <div onclick="prev()">❮</div>
  <div onclick="next()">❯</div>
</div>

<script>
let index = 0;
const slides = document.querySelectorAll('.slide');

function showSlide(i) {
  slides.forEach(s => s.classList.remove('active'));
  slides[i].classList.add('active');
}

function next() {
  index = (index + 1) % slides.length;
  showSlide(index);
}

function prev() {
  index = (index - 1 + slides.length) % slides.length;
  showSlide(index);
}
</script>

</body>
</html>
